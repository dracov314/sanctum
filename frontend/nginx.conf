server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the backend
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large PDF file downloads
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    # Never cache entry points or unhashed assets
    location ~* ^/(flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|version\.json|index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri /index.html;
    }

    # Content-hashed assets can be cached long-term
    location ~* \.(js|wasm|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Flutter web — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
